name: Daily job scan

on:
  schedule:
    # 13:00 UTC ≈ 9am ET / 6am PT
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scanner
        run: python scripts/scan_jobs.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git diff --quiet --cached || git commit -m "Daily job scan: $(date -u +%Y-%m-%d)"
          git push
